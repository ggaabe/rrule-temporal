    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rrule-temporal playground</title>

    <meta
      name="description"
      content="Interactive playground for rrule-temporal. Build iCalendar RRULE recurrence rules (RFC 5545 and RFC 7529), see every occurrence in a list or calendar, and try the query API, with time zones, daylight saving, and non-Gregorian calendars on the JavaScript Temporal API."

      name="keywords"
      content="RRULE,iCalendar,RFC 5545,RFC 7529,recurrence rules,JavaScript,Temporal API,scheduling,calendar,time zones"

    />

    <script>
      // Apply the saved or system theme before the first paint.
      (function () {
        var dark;
        try {
          var saved = localStorage.getItem('theme');
          dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (error) {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
